# ------------------------------------------------------------
# 1. PROJECT
# ------------------------------------------------------------
project:
  name: continuous_sign_language_recognition
  seed: 42


# ------------------------------------------------------------
# 2. DATASET
# ------------------------------------------------------------
dataset:
  benchmark: isharah500
  root: ./data/${dataset.benchmark}
  metadata_root: ./metadata/${dataset.benchmark}

  use_rgb: true

  max_length: 128

  phase:
    train: train
    dev: dev
    test: test

# ------------------------------------------------------------
# 3. POSE
# ------------------------------------------------------------
pose:
  format: pkl
  embed_dim: 768
  num_heads: 12

  left_hand:
    num_joints: 21
    channels: 2
    embed_dim: 256
    num_heads: 8

  right_hand:
    num_joints: 21
    channels: 2
    embed_dim: 256
    num_heads: 8

  face:
    enabled: true
    num_joints: 19
    channels: 2
    embed_dim: 128
    num_heads: 4

  body:
    enabled: true
    num_joints: 25
    channels: 2
    embed_dim: 128
    num_heads: 4

  transform: true
  normalize: true
  augmentation: true


rgb:
  image_size: 112
  format: jpg
  patch_size: 8
  channels: 3
  embed_dim: 256
  num_heads: 8

  left_hand:
    enabled: true

  right_hand:
    enabled: true

  transform: true
  normalize: true
  augmentation: true


# ------------------------------------------------------------
# 5. DATALOADER
# ------------------------------------------------------------
dataloader:
  batch_size: 16
  num_workers: 4

  shuffle: true

  pin_memory: true
  drop_last: false

  persistent_workers: true


# ------------------------------------------------------------
# 7. MODEL
# ------------------------------------------------------------
model:
  name: null

  num_classes: null

  use_rgb: ${dataset.use_rgb}

  act: gelu
  depth: 2
  dropout: 0.1

  pre_norm: true

  pose_rgb_num_heads: 8
  pose_pose_num_heads: 8
  mlp_ratio: 2

  fusion:
    type: cross_attention

# ============================================================
# Loss
# ============================================================

# loss:
#   name: "cross_entropy"

#   label_smoothing: 0.1


# ============================================================
# Optimizer
# ============================================================

optimizer:
  name: "adamw"

  learning_rate: 0.0001

  weight_decay: 0.0001

  betas: [0.9, 0.999]

  eps: 1.0e-8


# ============================================================
# Scheduler
# ============================================================

scheduler:
  name: "cosine"

  min_lr: 1.0e-6

  warmup_epochs: 5


# ============================================================
# Training
# ============================================================

# training:
#   epochs: 50

#   seed: 379

#   device: "cuda"

#   mixed_precision: true

#   gradient_clip:
#     enabled: false
#     max_norm: 1.0

#   gradient_accumulation_steps: 1


# ============================================================
# Validation
# ============================================================

validation:
  enabled: true

  interval: 1

  metric: "top1"

  mode: "max"


# ============================================================
# Early Stopping
# ============================================================

early_stopping:
  enabled: true

  patience: 10

  metric: "val_top1"

  mode: "max"


# ============================================================
# Checkpoint
# ============================================================

checkpoint:
  save_dir: "./checkpoints"

  save_best: true

  save_last: true

  filename: "best_model.pth"

  monitor: val_wer
  mode: min


# ============================================================
# Logging
# ============================================================

logging:
  log_dir: "./logs"

  experiment_name: "ishara500_siformer"

  tensorboard: true

  print_interval: 10


# ------------------------------------------------------------
# 8. TEMPORAL ENCODER
# ------------------------------------------------------------
temporal:
  encoder: transformer

  d_model: 512
  num_layers: 4
  num_heads: 8

  dim_feedforward: 2048

  dropout: 0.1

  activation: gelu


# ------------------------------------------------------------
# 9. CLASSIFIER
# ------------------------------------------------------------
classifier:
  type: ctc
  dropout: 0.1


# ------------------------------------------------------------
# 10. TRAINING
# ------------------------------------------------------------
training:
  epochs: 100

  optimizer:
    name: adamw
    lr: 0.0001
    weight_decay: 0.01

  scheduler:
    name: cosine
    warmup_epochs: 5

  gradient_clip:
    enabled: true
    max_norm: 5.0

  mixed_precision:
    enabled: true

  accumulation_steps: 1


# ------------------------------------------------------------
# 11. LOSS
# ------------------------------------------------------------
loss:
  type: ctc

  ctc:
    blank: 0
    zero_infinity: true

# ------------------------------------------------------------
# 14. DEVICE
# ------------------------------------------------------------
device:
  accelerator: cuda
  gpu_ids: [0]

  deterministic: false